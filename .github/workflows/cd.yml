name: CI/CD with Docker for Node.js + TypeScript

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ci-cd-tutorial:latest

      - name: Deploy Docker Image to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.EC2_USER }}
            rm -rf CI-CD-Tutorial
            git clone https://github.com/concepts015/CI-CD-Tutorial.git
            cd CI-CD-Tutorial

            sudo bash ./install_docker.sh

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ci-cd-tutorial:latest
            sudo docker stop ci-cd-tutorial || true
            sudo docker rm ci-cd-tutorial || true

            sudo docker run -d --name ci-cd-tutorial -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/ci-cd-tutorial:latest
